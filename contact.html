<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="Stylesheet.css">
</head>
<body>
    <header>
            <h1>My Blog</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="components.html">Components</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>
    <main>
        <section>
            <h2>Get in Touch</h2>
            <p>Please fill out the form below to contact me.</p>
            <form action="#" method="post" class="contact-form">
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" name="fullName" placeholder="Enter your full name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="example@mail.com" required>
                </div>
                <div class="form-group">
                    <label for="age">Age</label>
                    <input type="number" id="age" name="age" min="1" max="120" placeholder="e.g. 25">
                </div>
                <div class="form-group">
                    <label for="preferredDate">Preferred Appointment Date</label>
                    <input type="date" id="preferredDate" name="preferredDate">
                </div>
                <div class="form-group">
                    <label for="subject">Subject</label>
                    <select id="subject" name="subject" required>
                        <option value="" disabled selected>Select a subject</option>
                        <option value="general">General Inquiry</option>
                        <option value="course">Course Question</option>
                        <option value="collaboration">Project Collaboration</option>
                        <option value="feedback">Feedback</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Preferred Contact Method</label>
                    <div class="options">
                        <label class="label">
                            <input type="radio" name="contactMethod" value="email" checked> Email
                        </label>
                        <label class="label">
                            <input type="radio" name="contactMethod" value="phone"> Phone
                        </label>
                    </div>
                </div>
                <div class="form-group">
                    <label>Topics of Interest</label>
                    <div class="options">
                        <label class="label">
                            <input type="checkbox" name="interests" value="web"> Web Development
                        </label>
                        <label class="label">
                            <input type="checkbox" name="interests" value="database"> Databases
                        </label>
                        <label class="label">
                            <input type="checkbox" name="interests" value="design"> UI/UX Design
                        </label>
                    </div>
                </div>
                <div class="form-group">
                    <label for="message">Your Message</label>
                    <textarea id="message" name="message" rows="5" placeholder="Write your message here..." required></textarea>
                </div>
                <button type="submit" class="submit">Send Message</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 My Blog. All rights reserved.</p>
    </footer>
</body>
</html>
